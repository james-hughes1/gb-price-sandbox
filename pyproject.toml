[project]
name = "gb-price-sandbox"
version = "0.1.0"
description = "GB wholesale power prices: probabilistic forecasting backtests and battery dispatch optimisation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "highspy>=1.7",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pulp>=2.8",
    "pyarrow>=15",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gb_price_sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific
    "PD",  # pandas-vet
    "D",   # pydocstyle
]
ignore = [
    "D100", # module docstring
    "D104", # package docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"app/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit external APIs (deselect with -m 'not network')",
]
